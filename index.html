    <!-- Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Check for redirected query string from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        // Handle redirect parameter for SEO-friendly routing
        else if (l.search.includes('redirect=')) {
          var params = new URLSearchParams(l.search);
          var redirect = params.get('redirect');
          if (redirect) {
            window.history.replaceState(null, null, decodeURIComponent(redirect));
          }
        }
      }(window.location))
    </script>

    <!-- Google Tag Manager (Deferred to idle / user interaction for maximum PageSpeed) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({'gtm.start': new Date().getTime(), event:'gtm.js'});
      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          var f = document.getElementsByTagName('script')[0];
          var j = document.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-P2QX664F';
          f.parentNode.insertBefore(j, f);
        }
        
        // Load on first user interaction or when browser is idle
        if ('requestIdleCallback' in window) {
          window.addEventListener('load', function() {
            requestIdleCallback(function() { setTimeout(loadGTM, 1500); }, { timeout: 3500 });
          }, { once: true });
        } else {
          window.addEventListener('load', function() { setTimeout(loadGTM, 2000); }, { once: true });
        }
        ['scroll', 'touchstart', 'mousemove', 'click'].forEach(function(ev) {
          window.addEventListener(ev, loadGTM, { once: true, passive: true });
        });
      })();
    </script>
